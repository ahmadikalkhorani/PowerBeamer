[package]
name = "powerbeamer"
version = "0.3.0"
edition = "2024"
authors = ["Vahid Kalkhorani"]
description = "High-performance LaTeX Beamer & PDF Presentation Studio"
repository = "https://github.com/ahmadikalkhorani/PowerBeamer"

[lib]
name = "presenter"
path = "src/lib.rs"

[[bin]]
name = "powerbeamer"
path = "src/main.rs"

[dependencies]
slint = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdfium-render = "0.9.4"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
flate2 = "1.0"
tar = "0.4"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimize dependencies (image, pdfium bindings, slint) even in debug builds so
# inking and PDF rendering stay usable while developing.
[profile.dev.package."*"]
opt-level = 2
