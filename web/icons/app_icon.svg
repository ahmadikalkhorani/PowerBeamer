<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#051338" />
      <stop offset="55%" stop-color="#030921" />
      <stop offset="100%" stop-color="#020514" />
    </radialGradient>

    <!-- Ambient Center Backlight -->
    <radialGradient id="ambient-glow" cx="50%" cy="49%" r="48%">
      <stop offset="0%" stop-color="#00d8ff" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#0088ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0" />
    </radialGradient>

    <!-- Center Orb Gradient -->
    <radialGradient id="orb-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="72%" stop-color="#88f7ff" stop-opacity="0.9" />
      <stop offset="92%" stop-color="#00d9ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Tube Glow Filter -->
    <filter id="neon-bloom" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur-wide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur-med" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur-tight" />
      <feMerge>
        <feMergeNode in="blur-wide" />
        <feMergeNode in="blur-med" />
        <feMergeNode in="blur-tight" />
      </feMerge>
    </filter>

    <!-- Intense Center Orb Filter -->
    <filter id="orb-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="orb-blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="orb-blur2" />
      <feMerge>
        <feMergeNode in="orb-blur1" />
        <feMergeNode in="orb-blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Master Vector Geometry -->
    <g id="pb-neon-paths" fill="none" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6">
      
      <!-- 1. Outer P Top-Left Arch & Upper B Bowl -->
      <path d="M 160 492
               L 160 374
               A 196 196 0 0 1 552 374
               L 552 444
               L 654 444
               A 95 95 0 0 0 749 349
               A 95 95 0 0 0 558 349
               L 558 430" />

      <!-- 2. Inner P Counter Loop -->
      <path d="M 254 444
               L 254 374
               A 102 102 0 0 1 458 374
               L 458 435" />

      <!-- 3. Main P Stem, Bottom U-Turn, B Spine, and B Outer Contours -->
      <path d="M 455 445
               C 430 472, 390 482, 326 482
               C 220 482, 160 546, 160 648
               L 160 764
               A 47 47 0 0 0 254 764
               L 254 648
               C 254 596, 286 574, 344 574
               C 398 574, 434 562, 458 532
               L 458 684
               C 458 798, 536 862, 658 862
               C 786 862, 868 784, 868 666
               C 868 584, 826 520, 762 490
               C 818 456, 852 396, 852 328
               C 852 222, 768 158, 654 158
               C 608 158, 566 174, 534 202" />

      <!-- 4. Lower B Inner Counter Loop -->
      <path d="M 554 536
               L 656 536
               C 724 536, 770 578, 770 644
               C 770 710, 724 754, 656 754
               C 590 754, 554 720, 554 662
               Z" />
    </g>
  </defs>

  <!-- macOS / iOS Squircle Background -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg-grad)" />

  <!-- Subtle Ambient Radial Backlight -->
  <circle cx="512" cy="500" r="460" fill="url(#ambient-glow)" />

  <!-- Layer 1: Wide Cyan Outer Glow -->
  <use href="#pb-neon-paths" stroke="#00a2ff" stroke-width="44" filter="url(#neon-bloom)" opacity="0.85" />

  <!-- Layer 2: Medium Electric Cyan Halo -->
  <use href="#pb-neon-paths" stroke="#00e1ff" stroke-width="28" filter="url(#neon-bloom)" opacity="0.9" />

  <!-- Layer 3: Crisp Cyan Tube Casing -->
  <use href="#pb-neon-paths" stroke="#00ffff" stroke-width="22" opacity="0.95" />

  <!-- Layer 4: Intense White Neon Core -->
  <use href="#pb-neon-paths" stroke="#ffffff" stroke-width="11" />

  <!-- Central Glowing Intersection Node -->
  <g filter="url(#orb-bloom)">
    <!-- Cyan Outer Ring of the Node -->
    <circle cx="504" cy="488" r="82" fill="url(#orb-grad)" />
    <!-- Pure White Inner Hot Core -->
    <circle cx="504" cy="488" r="46" fill="#ffffff" />
  </g>
</svg>