name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (macOS arm64)
    # Apple Silicon runner: the bundled libpdfium.dylib is arm64 and the PDF tests need it.
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # The media tests decode test_deck/sample_video.mp4 with ffmpeg/ffprobe.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test
