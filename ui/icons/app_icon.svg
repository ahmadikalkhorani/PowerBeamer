<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242938" />
      <stop offset="50%" stop-color="#141722" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Tablet / Slide Frame Gradients -->
    <linearGradient id="screenFrameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b2b" />
      <stop offset="50%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Wave Gradients -->
    <linearGradient id="cyanWave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleWave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff0080" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8" />
    </linearGradient>

    <!-- Stylus Gradients -->
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="penTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Outer macOS Squircle with Bevel Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Soft Bevel Highlight -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Presentation Screen / Canvas Container -->
  <g transform="translate(64, 84)">
    <!-- Bezel Shadow -->
    <rect x="0" y="0" width="384" height="280" rx="28" fill="#000000" opacity="0.6" filter="url(#neonGlow)" />
    <!-- Bezel Outer -->
    <rect x="0" y="0" width="384" height="280" rx="28" fill="url(#screenFrameGrad)" stroke="#334155" stroke-width="2.5" />
    <!-- Inner Screen Display -->
    <rect x="14" y="14" width="356" height="252" rx="18" fill="url(#screenGlass)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Screen Status / Camera Dot -->
    <circle cx="36" cy="36" r="4.5" fill="#38bdf8" opacity="0.85" />

    <!-- Glowing Waves / Inked Stroke -->
    <g filter="url(#neonGlow)">
      <!-- Purple secondary wave -->
      <path d="M 30,195 C 100,230 140,80 230,140 C 290,180 320,210 350,150" fill="none" stroke="url(#purpleWave)" stroke-width="16" stroke-linecap="round" opacity="0.75" />
      <!-- Cyan primary bright presentation wave -->
      <path d="M 28,155 C 90,80 160,225 240,155 C 295,105 330,135 352,190" fill="none" stroke="url(#cyanWave)" stroke-width="14" stroke-linecap="round" />
    </g>

    <!-- Starburst Sparkle at Drawing Point -->
    <g transform="translate(236, 158)" filter="url(#starGlow)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" opacity="0.4" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
      <line x1="-7" y1="7" x2="7" y2="-7" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- Digital Stylus Inking Pen (Diagonal floating overlay) -->
  <g transform="translate(300, 95) rotate(42)">
    <!-- Pen Drop Shadow -->
    <rect x="-14" y="-8" width="28" height="230" rx="14" fill="#000000" opacity="0.5" filter="url(#neonGlow)" />

    <!-- Pen Body Barrel -->
    <rect x="-13" y="0" width="26" height="210" rx="13" fill="url(#penBody)" stroke="#64748b" stroke-width="1" />

    <!-- Pen Grip Button -->
    <rect x="-4" y="90" width="8" height="34" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />

    <!-- Pen Tip Cone -->
    <path d="M -13,210 L 0,248 L 13,210 Z" fill="url(#penTip)" />
    <!-- Fine active Nib Point -->
    <circle cx="0" cy="249" r="3.5" fill="#ffffff" filter="url(#starGlow)" />

    <!-- Pen Accent Rings -->
    <rect x="-13" y="32" width="26" height="4" fill="#38bdf8" opacity="0.9" />
    <rect x="-13" y="40" width="26" height="2" fill="#38bdf8" opacity="0.6" />
    <circle cx="0" cy="14" r="5" fill="#38bdf8" opacity="0.7" />
  </g>
</svg>
